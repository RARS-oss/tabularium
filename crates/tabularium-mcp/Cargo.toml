[package]
name = "tabularium-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabularium-core = { version = "0.1.0", path = "../tabularium-core" }
thiserror = "2.0.20"
tiny_http = { version = "0.12.0", default-features = false, optional = true }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false }

[features]
default = ["http"]
http = ["dep:tiny_http"]
