[package]
name = "tabularium-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
fastembed = { version = "6.0.3", optional = true }
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[features]
default = ["fastembed"]
fastembed = ["dep:fastembed"]
