[workspace]
resolver = "2"
members = [
    "crates/tabularium-core",
    "crates/tabularium-mcp",
    "crates/tabularium",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RARS-oss/tabularium"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
